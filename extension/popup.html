<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Padlock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <span class="badge">P</span>
      <div>
        <div class="title">Padlock</div>
        <div class="subtitle">Secure Credential Vault</div>
      </div>
    </header>

    <main id="app" class="app">
      <div class="loading-state">
        <span class="spinner"></span>
        <p class="muted">Loading&hellip;</p>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>

    <template id="tpl-loading">
      <div class="loading-state">
        <span class="spinner"></span>
        <p class="muted" id="loading-message">Loading&hellip;</p>
      </div>
    </template>

    <template id="tpl-signin">
      <div class="panel">
        <h1>Sign in</h1>
        <p class="muted">Verify your identity to continue to Padlock.</p>
        <button class="btn btn-primary" data-action="sign-in">Sign in with Google</button>
      </div>
    </template>

    <template id="tpl-no-vault">
      <div class="panel">
        <h1>Vault not set up</h1>
        <p class="muted">Finish setting up your master password on the Padlock website first.</p>
        <button class="btn btn-secondary" data-action="open-website">Open Padlock website</button>
        <button class="btn btn-ghost" data-action="sign-out">Sign out</button>
      </div>
    </template>

    <template id="tpl-unlock">
      <div class="panel">
        <h1>Unlock vault</h1>
        <p class="muted">Enter your master password. It is never sent anywhere.</p>
        <input type="password" id="unlock-password" class="input" placeholder="Master password" autofocus />
        <p class="warning" id="unlock-capslock" hidden>&#9679; Caps Lock is on</p>
        <p class="error" id="unlock-error" hidden></p>
        <button class="btn btn-primary" data-action="unlock">Unlock</button>
        <button class="btn btn-ghost" data-action="sign-out">Sign out</button>
      </div>
    </template>

    <template id="tpl-vault">
      <div class="panel">
        <div class="vault-header">
          <h1>Your vault</h1>
          <div>
            <button class="btn btn-ghost btn-sm" data-action="lock">Lock</button>
            <button class="btn btn-ghost btn-sm" data-action="sign-out">Sign out</button>
          </div>
        </div>
        <button class="btn btn-secondary" data-action="add-entry">+ Add entry</button>

        <p class="section-label" id="match-label">This site</p>
        <p class="muted" id="match-empty" hidden>No saved entries for this site.</p>
        <ul class="entry-list" id="entry-list-match"></ul>

        <details class="all-section" id="all-section">
          <summary class="section-summary">All items</summary>
          <ul class="entry-list" id="entry-list-all"></ul>
        </details>
      </div>
    </template>

    <template id="tpl-entry">
      <li class="entry">
        <div class="entry-info">
          <div class="entry-name"></div>
          <div class="entry-username" data-action="copy-username" title="Click to copy username"></div>
          <div class="entry-match-reason" hidden></div>
        </div>
        <div class="entry-actions">
          <button class="btn btn-primary btn-sm" data-action="autofill">Autofill</button>
          <button class="entry-icon-btn" data-action="copy-password" title="Copy password" aria-label="Copy password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
          <button class="entry-icon-btn" data-action="edit" title="Edit entry" aria-label="Edit entry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="entry-icon-btn entry-icon-btn-danger" data-action="delete" title="Delete entry" aria-label="Delete entry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
        <div class="entry-confirm" hidden>
          <p class="entry-confirm-label">Delete this entry? This can&rsquo;t be undone.</p>
          <div class="entry-confirm-actions">
            <button class="btn btn-secondary btn-sm" data-action="cancel-delete">Keep it</button>
            <button class="btn btn-danger btn-sm" data-action="confirm-delete">Delete</button>
          </div>
        </div>
      </li>
    </template>

    <template id="tpl-entry-form">
      <div class="panel">
        <h1 id="entry-form-title">Add entry</h1>
        <input type="text" id="form-site-name" class="input" placeholder="Site name (e.g. Gmail)" />
        <input type="text" id="form-site-url" class="input" placeholder="Site URL (e.g. gmail.com)" />
        <input type="text" id="form-username" class="input" placeholder="Username" />

        <div class="password-row">
          <input type="password" id="form-password" class="input input-inline" placeholder="Password" />
          <button type="button" class="icon-btn" id="toggle-password-visibility" aria-label="Show password" title="Show password">👁</button>
        </div>

        <div class="strength-meter" id="strength-meter" hidden>
          <div class="strength-track"><span id="strength-fill"></span></div>
          <span class="strength-label" id="strength-label"></span>
        </div>

        <details class="gen-section" id="gen-section">
          <summary class="section-summary">Generate a strong password</summary>
          <div class="gen-panel">
            <div class="gen-row">
              <label for="gen-length">Length</label>
              <input type="range" id="gen-length" min="8" max="32" value="16" />
              <span class="gen-length-value" id="gen-length-value">16</span>
            </div>
            <label class="gen-checkbox">
              <input type="checkbox" id="gen-upper" checked /> Uppercase (A&ndash;Z)
            </label>
            <label class="gen-checkbox">
              <input type="checkbox" id="gen-numbers" checked /> Numbers (0&ndash;9)
            </label>
            <label class="gen-checkbox">
              <input type="checkbox" id="gen-symbols" checked /> Symbols (!@#$)
            </label>
            <button type="button" class="btn btn-secondary btn-sm" id="gen-generate-btn">
              Generate password
            </button>
          </div>
        </details>

        <p class="error" id="entry-form-error" hidden></p>
        <button class="btn btn-primary" data-action="save-entry">Save</button>
        <button class="btn btn-ghost" data-action="cancel-entry">Cancel</button>
      </div>
    </template>

    <script src="config.js"></script>
    <script src="domainMatch.js"></script>
    <script src="crypto.js"></script>
    <script src="auth.js"></script>
    <script src="supabaseRest.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
